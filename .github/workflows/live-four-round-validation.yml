name: Live Four-Round Synthetic Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - "backend/scripts/live_four_round_validation.py"
      - "backend/app/**"
      - ".github/workflows/live-four-round-validation.yml"

permissions:
  contents: read

concurrency:
  group: live-four-round-validation
  cancel-in-progress: false

jobs:
  live-validation:
    name: Run four rounds on local Ollama and RTX 4060
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      OLLAMA_MODEL: qwen3.5:4b
      RADONC_AGENT_CONCURRENCY: "1"
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Select installed Python 3.11 or newer
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $launcher = Get-Command py -ErrorAction SilentlyContinue
          $selected = $null
          if ($launcher) {
            foreach ($version in @("3.13", "3.12", "3.11")) {
              $candidate = & py "-$version" -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $candidate) { $selected = [string]($candidate | Select-Object -Last 1); break }
            }
          }
          if (-not $selected) {
            $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
            if ($pythonCommand) { $candidate = & python -c "import sys; print(sys.executable)" 2>$null; if ($LASTEXITCODE -eq 0 -and $candidate) { $selected = [string]($candidate | Select-Object -Last 1) } }
          }
          if (-not $selected) { throw "No usable Python 3.11+ installation found." }
          $versionText = & $selected -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ([version]$versionText -lt [version]"3.11") { throw "Python 3.11+ required; found $versionText." }
          "PYTHON_EXE=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install backend dependencies
        working-directory: backend
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Ollama and GPU before starting
        shell: powershell
        run: |
          & $env:PYTHON_EXE -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:11434/api/version', timeout=5).read().decode())"
          if ($LASTEXITCODE -ne 0) { throw "Ollama is not reachable." }
          nvidia-smi
          Write-Host "Model: $env:OLLAMA_MODEL; concurrency: $env:RADONC_AGENT_CONCURRENCY"
      - name: Execute four-round baseline validation
        shell: powershell
        run: |
          & $env:PYTHON_EXE (Join-Path $env:GITHUB_WORKSPACE "backend/scripts/live_four_round_validation.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload baseline validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radonc-live-four-round-validation
          path: backend/validation_artifacts/live_four_round_validation.json
          if-no-files-found: warn
          retention-days: 14
