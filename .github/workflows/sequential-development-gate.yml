name: Sequential Development Gate

on:
  push:
    branches:
      - feature/four-round-mdt-and-performance
  pull_request:
    branches:
      - main
      - feature/four-round-mdt-and-performance
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: sequential-development-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-sequence:
    name: Sequential Development Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head and history
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run adversarial sequential-gate tests
        working-directory: backend
        run: python -m pytest tests/test_development_plan.py -q

      - name: Validate ordered plan, scope and exact-SHA GitHub evidence
        working-directory: backend
        run: python scripts/validate_development_plan.py --plan docs/development_plan.json --head "$GITHUB_HEAD_SHA"
