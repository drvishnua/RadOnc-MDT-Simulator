name: Ollama NVIDIA GPU Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/workflows/ollama-gpu-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: ollama-gpu-diagnostic-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Ollama GPU discovery without starting inference
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect NVIDIA adapter, driver and available VRAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== MACHINE ==="
          hostname
          whoami
          Write-Host "=== VIDEO ADAPTER ==="
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,Status | Format-List | Out-String | Write-Host

          $nvidiaSmi = (Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue).Source
          if (-not $nvidiaSmi) {
            $candidate = Join-Path $env:windir "System32\nvidia-smi.exe"
            if (Test-Path $candidate) { $nvidiaSmi = $candidate }
          }
          if (-not $nvidiaSmi) { throw "nvidia-smi.exe not found." }

          Write-Host "=== NVIDIA GPU STATE ==="
          & $nvidiaSmi --query-gpu=name,driver_version,memory.total,memory.used,memory.free,utilization.gpu,temperature.gpu,power.draw --format=csv
          Write-Host "=== NVIDIA GPU INVENTORY ==="
          & $nvidiaSmi -L

      - name: Inspect Ollama placement and environment overrides
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $ollamaExe = (Get-Command ollama.exe -ErrorAction SilentlyContinue).Source
          if (-not $ollamaExe) { throw "ollama.exe not found on PATH." }

          Write-Host "=== OLLAMA VERSION AND PATH ==="
          Write-Host "OLLAMA_EXE=$ollamaExe"
          & $ollamaExe --version
          Write-Host "=== MODEL LIST ==="
          & $ollamaExe list
          Write-Host "=== CURRENT MODEL PLACEMENT ==="
          & $ollamaExe ps

          Write-Host "=== CUDA / OLLAMA ENVIRONMENT (PROCESS, USER, MACHINE) ==="
          foreach ($name in @("CUDA_VISIBLE_DEVICES","CUDA_PATH","CUDA_HOME","OLLAMA_LLM_LIBRARY","OLLAMA_FLASH_ATTENTION","OLLAMA_GPU_OVERHEAD","OLLAMA_NUM_GPU","GGML_CUDA_VISIBLE_DEVICES")) {
            $processValue = [Environment]::GetEnvironmentVariable($name,"Process")
            $userValue = [Environment]::GetEnvironmentVariable($name,"User")
            $machineValue = [Environment]::GetEnvironmentVariable($name,"Machine")
            Write-Host ("ENV {0} PROCESS=[{1}] USER=[{2}] MACHINE=[{3}]" -f $name,$processValue,$userValue,$machineValue)
          }

          Write-Host "=== OLLAMA PROCESSES ==="
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match "ollama" } | Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List | Out-String | Write-Host

      - name: Inspect installed Ollama CUDA backends
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $ollamaRoot = Join-Path $env:LOCALAPPDATA "Programs\Ollama"
          $libraryRoot = Join-Path $ollamaRoot "lib\ollama"
          Write-Host "OLLAMA_ROOT=$ollamaRoot"
          Write-Host "OLLAMA_LIBRARY_ROOT=$libraryRoot"
          if (Test-Path $libraryRoot) {
            Get-ChildItem $libraryRoot -Force | Select-Object Name,Mode,Length | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "=== CUDA / VULKAN BACKEND DIRECTORIES ==="
            Get-ChildItem $libraryRoot -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "cuda|vulkan|cpu" } |
              Select-Object -First 100 -ExpandProperty FullName |
              ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "OLLAMA_LIBRARY_ROOT_NOT_FOUND"
          }

      - name: Inspect Ollama server GPU discovery log
        if: always()
        shell: powershell
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "Ollama\server.log"
          Write-Host "OLLAMA_SERVER_LOG=$logPath"
          if (Test-Path $logPath) {
            Write-Host "=== GPU DISCOVERY / LIBRARY LINES FROM SERVER LOG ==="
            Select-String -Path $logPath -Pattern "Dynamic LLM libraries|cuda|nvidia|gpu|offload|library|failed to initialize|no device|device unavailable|driver" -CaseSensitive:$false |
              Select-Object -Last 180 |
              ForEach-Object { Write-Host ("LINE {0}: {1}" -f $_.LineNumber,$_.Line) }
          } else {
            Write-Host "OLLAMA_SERVER_LOG_NOT_FOUND"
          }
