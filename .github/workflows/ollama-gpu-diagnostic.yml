name: Ollama NVIDIA GPU Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/workflows/ollama-gpu-diagnostic.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ollama-gpu-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: ollama-gpu-diagnostic-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Ollama GPU discovery without starting inference
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect NVIDIA adapter, driver and available VRAM
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== MACHINE ==="
          hostname
          whoami
          Write-Host "=== VIDEO ADAPTER ==="
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,Status | Format-List | Out-String | Write-Host

          $nvidiaSmi = (Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue).Source
          if (-not $nvidiaSmi) {
            $candidate = Join-Path $env:windir "System32\nvidia-smi.exe"
            if (Test-Path $candidate) { $nvidiaSmi = $candidate }
          }
          if (-not $nvidiaSmi) { throw "nvidia-smi.exe not found." }

          Write-Host "=== NVIDIA GPU STATE ==="
          & $nvidiaSmi --query-gpu=name,driver_version,memory.total,memory.used,memory.free,utilization.gpu,temperature.gpu,power.draw --format=csv
          Write-Host "=== NVIDIA GPU INVENTORY ==="
          & $nvidiaSmi -L

      - name: Check Ollama HTTP API and configured model without inference
        shell: powershell
        env:
          OLLAMA_MODEL: qwen3.5:4b
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== OLLAMA HTTP API ==="
          try {
            $version = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/version" -TimeoutSec 5
            Write-Host "OLLAMA_API_REACHABLE=True"
            Write-Host "OLLAMA_API_VERSION=$($version.version)"
            $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
            $model = @($tags.models | Where-Object {
              $_.name -eq $env:OLLAMA_MODEL -or $_.model -eq $env:OLLAMA_MODEL
            } | Select-Object -First 1)
            if ($model.Count -gt 0) {
              Write-Host "CONFIGURED_MODEL_PRESENT=True"
              Write-Host "CONFIGURED_MODEL=$($model[0].name)"
              Write-Host "CONFIGURED_MODEL_SIZE_BYTES=$($model[0].size)"
            } else {
              Write-Host "CONFIGURED_MODEL_PRESENT=False"
              Write-Host "CONFIGURED_MODEL=$env:OLLAMA_MODEL"
            }
          } catch {
            Write-Host "OLLAMA_API_REACHABLE=False"
            Write-Host "OLLAMA_API_ERROR=$($_.Exception.Message)"
          }

      - name: Inspect Ollama placement and environment overrides
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $ollamaExe = (Get-Command ollama.exe -ErrorAction SilentlyContinue).Source
          if (-not $ollamaExe) {
            $candidates = @(
              (Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"),
              (Join-Path $env:ProgramFiles "Ollama\ollama.exe")
            )
            $ollamaExe = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          }
          if (-not $ollamaExe) {
            Write-Host "OLLAMA_EXECUTABLE_NOT_FOUND"
          }

          if ($ollamaExe) {
            Write-Host "=== OLLAMA VERSION AND PATH ==="
            Write-Host "OLLAMA_EXE=$ollamaExe"
            & $ollamaExe --version
            Write-Host "=== MODEL LIST ==="
            & $ollamaExe list
            Write-Host "=== CURRENT MODEL PLACEMENT ==="
            & $ollamaExe ps
          }

          Write-Host "=== CUDA / OLLAMA ENVIRONMENT (PROCESS, USER, MACHINE) ==="
          foreach ($name in @("CUDA_VISIBLE_DEVICES","CUDA_PATH","CUDA_HOME","OLLAMA_LLM_LIBRARY","OLLAMA_FLASH_ATTENTION","OLLAMA_GPU_OVERHEAD","OLLAMA_NUM_GPU","GGML_CUDA_VISIBLE_DEVICES")) {
            $processValue = [Environment]::GetEnvironmentVariable($name,"Process")
            $userValue = [Environment]::GetEnvironmentVariable($name,"User")
            $machineValue = [Environment]::GetEnvironmentVariable($name,"Machine")
            Write-Host ("ENV {0} PROCESS=[{1}] USER=[{2}] MACHINE=[{3}]" -f $name,$processValue,$userValue,$machineValue)
          }

          Write-Host "=== OLLAMA PROCESSES ==="
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match "ollama" } | Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List | Out-String | Write-Host

      - name: Inspect installed Ollama CUDA backends
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $ollamaRoot = Join-Path $env:LOCALAPPDATA "Programs\Ollama"
          $libraryRoot = Join-Path $ollamaRoot "lib\ollama"
          Write-Host "OLLAMA_ROOT=$ollamaRoot"
          Write-Host "OLLAMA_LIBRARY_ROOT=$libraryRoot"
          if (Test-Path $libraryRoot) {
            Get-ChildItem $libraryRoot -Force | Select-Object Name,Mode,Length | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "=== CUDA / VULKAN BACKEND DIRECTORIES ==="
            Get-ChildItem $libraryRoot -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "cuda|vulkan|cpu" } |
              Select-Object -First 100 -ExpandProperty FullName |
              ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "OLLAMA_LIBRARY_ROOT_NOT_FOUND"
          }

      - name: Inspect installed RadOnc application and bootstrap logs without changes
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $localAppData = [Environment]::GetFolderPath("LocalApplicationData")
          $installRoot = Join-Path $localAppData "Programs\RadOncMDT"
          $logs = Join-Path $localAppData "RadOncMDT\Logs"
          Write-Host "=== INSTALLED RADONC APPLICATION ==="
          Write-Host "RADONC_INSTALL_ROOT=$installRoot"
          $exe = Join-Path $installRoot "RadOncMDT.exe"
          if (Test-Path -LiteralPath $exe) {
            $file = Get-Item -LiteralPath $exe
            Write-Host "RADONC_INSTALLED_EXE_PRESENT=True"
            Write-Host "RADONC_EXE_VERSION=$($file.VersionInfo.FileVersion)"
            Write-Host "RADONC_EXE_SHA256=$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          } else {
            Write-Host "RADONC_INSTALLED_EXE_PRESENT=False"
          }

          $health = $null
          try {
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 4
            Write-Host "RADONC_INSTALLED_HEALTH_REACHABLE=True"
            Write-Host ("RADONC_HEALTH=" + ($health | ConvertTo-Json -Compress -Depth 4))
          } catch {
            Write-Host "RADONC_INSTALLED_HEALTH_REACHABLE=False"
          }

          if ($health) {
            try {
              $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/runtime" -TimeoutSec 10
              Write-Host ("RADONC_RUNTIME=" + ($runtime.ollama | ConvertTo-Json -Compress -Depth 6))
              $agents = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/agents" -TimeoutSec 10
              Write-Host "RADONC_API_ROLE_COUNT=$($agents.returned_agent_count)"
            } catch {
              Write-Host "RADONC_RUNTIME_CHECK_FAILED=$($_.Exception.Message)"
            }
          }

          foreach ($name in @("release-candidate-bootstrap.stdout.log","release-candidate-bootstrap.stderr.log")) {
            $path = Join-Path $logs $name
            Write-Host "--- $name ---"
            if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Tail 50 } else { Write-Host "BOOTSTRAP_LOG_NOT_FOUND" }
          }

          $pidFile = Join-Path $logs "backend.pid"
          if (Test-Path -LiteralPath $pidFile) {
            $pidValue = (Get-Content -LiteralPath $pidFile -Raw).Trim()
            Write-Host "RADONC_INSTALLED_PID=$pidValue"
            Get-CimInstance Win32_Process -Filter ("ProcessId = " + $pidValue) -ErrorAction SilentlyContinue |
              Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List | Out-String | Write-Host
          } else {
            Write-Host "RADONC_INSTALLED_PID_FILE_NOT_FOUND"
          }

      - name: Inspect Ollama server GPU discovery log
        if: always()
        shell: powershell
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "Ollama\server.log"
          Write-Host "OLLAMA_SERVER_LOG=$logPath"
          if (Test-Path $logPath) {
            Write-Host "=== GPU DISCOVERY / LIBRARY LINES FROM SERVER LOG ==="
            Select-String -Path $logPath -Pattern "Dynamic LLM libraries|cuda|nvidia|gpu|offload|library|failed to initialize|no device|device unavailable|driver" -CaseSensitive:$false |
              Select-Object -Last 180 |
              ForEach-Object { Write-Host ("LINE {0}: {1}" -f $_.LineNumber,$_.Line) }
          } else {
            Write-Host "OLLAMA_SERVER_LOG_NOT_FOUND"
          }
