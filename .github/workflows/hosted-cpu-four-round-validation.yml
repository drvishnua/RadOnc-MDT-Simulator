name: Hosted CPU Four-Round MDT Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/workflows/hosted-cpu-four-round-validation.yml"

permissions:
  contents: read

# One-time explicitly marked hosted CPU validation trigger.
concurrency:
  group: hosted-cpu-four-round-mdt-validation
  cancel-in-progress: false

jobs:
  four-round-cpu-validation:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-hosted-cpu-four-round]') }}
    name: 45-role four-round validation on isolated hosted CPU runner
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      OLLAMA_MODEL: qwen3.5:4b
      RADONC_AGENT_CONCURRENCY: "1"
      RADONC_VALIDATION_CPU_ONLY: "1"
    steps:
      - name: Check out selected development ref
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install isolated backend dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }

      - name: Provision isolated portable Ollama and qwen3.5:4b
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc Hosted CPU LocalAppData"
          $dataDirectory = Join-Path $localAppData "RadOncMDT\Data"
          $logDirectory = Join-Path $localAppData "RadOncMDT\Logs"
          New-Item -ItemType Directory -Force -Path $dataDirectory,$logDirectory | Out-Null
          $env:LOCALAPPDATA = $localAppData
          $env:RADONC_DATA_DIR = $dataDirectory

          foreach ($port in @(11434,11435)) {
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if ($listeners.Count -gt 0) {
              throw "Port $port is already occupied; refusing to reuse or stop an unrelated process."
            }
          }
          . (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Ensure-RadOnc-AIEngine.ps1")
          $existingOllama = Find-RadOncOllamaExecutable
          if ($existingOllama) {
            throw "A pre-existing Ollama executable was found at $existingOllama; clean isolated provisioning cannot be asserted."
          }

          Write-Host "HOSTED_CPU_BOOTSTRAP_STARTED"
          $ollamaUrl = Ensure-RadOncAIEngine -DataDirectory $dataDirectory -LogDirectory $logDirectory
          if ($ollamaUrl -ne "http://127.0.0.1:11435") {
            throw "Expected the isolated portable Ollama endpoint on 127.0.0.1:11435."
          }
          $version = Invoke-RestMethod -Uri "$ollamaUrl/api/version" -TimeoutSec 10
          if ($version.version -ne $RadOncOllamaVersion) {
            throw "Unexpected Ollama runtime version: $($version.version)"
          }
          $tags = Get-RadOncOllamaTags -BaseUrl $ollamaUrl
          if (-not (Test-RadOncModelInstalled -Tags $tags -ModelName "qwen3.5:4b")) {
            throw "qwen3.5:4b is not present after model pull."
          }

          # Keep the Ollama server and all four rounds inside this same Actions
          # step. GitHub cleans up child processes at step end, so splitting
          # provisioning and inference into separate steps terminates Ollama.
          $env:LOCALAPPDATA = $localAppData
          $env:RADONC_DATA_DIR = $dataDirectory
          $env:OLLAMA_BASE_URL = $ollamaUrl
          $env:OLLAMA_HOST = "127.0.0.1:11435"
          $env:OLLAMA_MODELS = Join-Path $localAppData "RadOncMDT\Models"
          $env:OLLAMA_MODEL = "qwen3.5:4b"
          $env:RADONC_VALIDATION_CPU_ONLY = "1"
          $env:RADONC_AGENT_CONCURRENCY = "1"
          Write-Host "HOSTED_CPU_OLLAMA_READY=$($version.version)"
          Write-Host "HOSTED_CPU_MODEL_PRESENT=qwen3.5:4b"
          Write-Host "HOSTED_CPU_ONLY=TRUE; NVIDIA telemetry is intentionally not collected."

          Write-Host "HOSTED_CPU_FOUR_ROUND_VALIDATION_STARTED"
          python backend/scripts/live_four_round_validation.py
          if ($LASTEXITCODE -ne 0) {
            throw "The 45-role four-round hosted CPU validation failed with exit code $LASTEXITCODE."
          }

      - name: Upload full four-round audit and isolated database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radonc-hosted-cpu-four-round-validation
          path: |
            backend/validation_artifacts/live_four_round_hosted_cpu_validation.json
            backend/validation_artifacts/live_four_round_hosted_cpu_validation.sqlite3
          if-no-files-found: warn
          retention-days: 14

      - name: Stop only the isolated Ollama process started by this job
        if: always()
        shell: powershell
        run: |
          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc Hosted CPU LocalAppData"
          $pidFile = Join-Path $localAppData "RadOncMDT\AIEngine\ollama-server.pid"
          if (-not (Test-Path -LiteralPath $pidFile -PathType Leaf)) {
            Write-Host "No isolated Ollama PID file found; no process was stopped."
            exit 0
          }
          $ollamaPid = 0
          if (-not [int]::TryParse((Get-Content -LiteralPath $pidFile -Raw).Trim(),[ref]$ollamaPid)) {
            Write-Warning "Invalid isolated Ollama PID file; no process was stopped."
            exit 0
          }
          $processInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $ollamaPid" -ErrorAction SilentlyContinue
          if (-not $processInfo) {
            Write-Host "The isolated Ollama process is already stopped."
            exit 0
          }
          $managedRoot = [IO.Path]::GetFullPath((Join-Path $localAppData "RadOncMDT\AIEngine\Ollama")) + "\"
          $actualPath = [string]$processInfo.ExecutablePath
          if (-not $actualPath -or -not [IO.Path]::GetFullPath($actualPath).StartsWith($managedRoot,[StringComparison]::OrdinalIgnoreCase)) {
            Write-Warning "PID did not resolve to the isolated Ollama executable; cleanup refused to stop it."
            exit 0
          }
          Stop-Process -Id $ollamaPid -Force
          Write-Host "HOSTED_ISOLATED_OLLAMA_STOPPED"
