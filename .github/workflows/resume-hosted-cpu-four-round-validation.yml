name: Resume Hosted CPU Four-Round MDT Validation
# Run-16 checkpoint continuation: resume unsaved R3 roles and Chair R4 from artifact 14169603817.

on:
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: "Workflow run ID containing the latest SQLite checkpoint"
        required: true
        default: "43714529807"
      checkpoint_artifact_name:
        description: "Artifact name containing that checkpoint"
        required: true
        default: "radonc-hosted-cpu-four-round-validation"
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/workflows/resume-hosted-cpu-four-round-validation.yml"
      - "backend/scripts/resume_hosted_four_round_validation.py"
      - "backend/tests/test_resume_hosted_four_round_validation.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: radonc-hosted-cpu-four-round-resume
  cancel-in-progress: false

jobs:
  resume-four-round-cpu-validation:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resume-hosted-cpu-r3]') }}
    name: Resume saved R3 contributions and generate Chair R4
    runs-on: windows-latest
    timeout-minutes: 245
    env:
      OLLAMA_MODEL: qwen3.5:4b
      RADONC_AGENT_CONCURRENCY: "1"
      RADONC_VALIDATION_CPU_ONLY: "1"
      RADONC_CHECKPOINT_RUN_ID: ${{ github.event.inputs.checkpoint_run_id || '43714529807' }}
    steps:
      - name: Check out continuation source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install isolated backend dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }

      - name: Restore checkpoint from prior workflow run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ github.event.inputs.checkpoint_artifact_name || 'radonc-hosted-cpu-four-round-validation' }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RADONC_CHECKPOINT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend/validation_artifacts/checkpoint

      - name: Resume R3 and Chair R4 using isolated Ollama
        timeout-minutes: 235
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "backend\validation_artifacts"
          $checkpointDirectory = Join-Path $artifactDirectory "checkpoint"
          $databaseName = "live_four_round_hosted_cpu_validation.sqlite3"
          $manifestName = "live_four_round_hosted_cpu_manifest.json"
          $checkpointDatabase = Join-Path $checkpointDirectory $databaseName
          $checkpointManifest = Join-Path $checkpointDirectory $manifestName
          $resumeManifest = Join-Path $checkpointDirectory "live_four_round_hosted_cpu_resume_manifest.json"
          if (Test-Path -LiteralPath $resumeManifest -PathType Leaf) {
            $checkpointManifest = $resumeManifest
          }
          if (-not (Test-Path -LiteralPath $checkpointDatabase -PathType Leaf)) {
            throw "Restored SQLite checkpoint is missing."
          }
          if (-not (Test-Path -LiteralPath $checkpointManifest -PathType Leaf)) {
            throw "Restored checkpoint manifest is missing."
          }
          $manifest = Get-Content -LiteralPath $checkpointManifest -Raw | ConvertFrom-Json
          $latestRun = [string]$manifest.resume_checkpoint.checkpoint_workflow_run_id
          if (-not $latestRun) { $latestRun = [string]$manifest.source.workflow_run_id }
          if ($latestRun -ne [string]$env:RADONC_CHECKPOINT_RUN_ID) {
            throw "Checkpoint manifest run ID does not match the requested artifact run."
          }
          if ([string]$manifest.source.commit_sha -ne "4683b0767bf5cade408e85ec31ef248b34e5321e") {
            throw "Checkpoint source SHA is not the original timed-out validation revision."
          }
          Copy-Item -LiteralPath $checkpointDatabase -Destination (Join-Path $artifactDirectory $databaseName) -Force
          Copy-Item -LiteralPath $checkpointManifest -Destination (Join-Path $artifactDirectory $manifestName) -Force
          $env:RADONC_CHECKPOINT_MANIFEST = Join-Path $artifactDirectory $manifestName

          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc Hosted CPU Resume LocalAppData"
          $dataDirectory = Join-Path $localAppData "RadOncMDT\Data"
          $logDirectory = Join-Path $localAppData "RadOncMDT\Logs"
          New-Item -ItemType Directory -Force -Path $dataDirectory,$logDirectory | Out-Null
          $env:LOCALAPPDATA = $localAppData
          $env:RADONC_DATA_DIR = $dataDirectory
          $exitCode = 1

          try {
            foreach ($port in @(11434,11435)) {
              $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
              if ($listeners.Count -gt 0) {
                throw "Port $port is occupied; refusing to reuse or stop an unrelated process."
              }
            }
            . (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Ensure-RadOnc-AIEngine.ps1")
            $existingOllama = Find-RadOncOllamaExecutable
            if ($existingOllama) {
              throw "A pre-existing Ollama executable was found; isolated provisioning cannot be asserted."
            }

            Write-Host "HOSTED_CPU_RESUME_BOOTSTRAP_STARTED"
            $ollamaUrl = Ensure-RadOncAIEngine -DataDirectory $dataDirectory -LogDirectory $logDirectory
            if ($ollamaUrl -ne "http://127.0.0.1:11435") {
              throw "Expected isolated Ollama endpoint on 127.0.0.1:11435."
            }
            $version = Invoke-RestMethod -Uri "$ollamaUrl/api/version" -TimeoutSec 10
            if ($version.version -ne $RadOncOllamaVersion) {
              throw "Unexpected Ollama version: $($version.version)"
            }
            $tags = Get-RadOncOllamaTags -BaseUrl $ollamaUrl
            if (-not (Test-RadOncModelInstalled -Tags $tags -ModelName "qwen3.5:4b")) {
              throw "qwen3.5:4b is missing after model provisioning."
            }
            $modelRecord = @($tags.models | Where-Object {
              ([string]$_.name -eq "qwen3.5:4b") -or ([string]$_.model -eq "qwen3.5:4b")
            } | Select-Object -First 1)
            if ($modelRecord.Count -ne 1) {
              throw "Could not identify exactly one qwen3.5:4b model record."
            }
            # Ollama /api/tags may return the SHA-256 as bare hex or with a sha256: prefix.
            # Normalize representation only; always compare the exact 64-hex model identity.
            $reportedDigest = [string]$modelRecord[0].digest
            $hexDigest = $reportedDigest
            if ($hexDigest.StartsWith("sha256:",[StringComparison]::OrdinalIgnoreCase)) {
              $hexDigest = $hexDigest.Substring(7)
            }
            if ($hexDigest.Length -ne 64) {
              throw "Installed model did not return a 64-character SHA-256 digest."
            }
            foreach ($hexChar in $hexDigest.ToCharArray()) {
              if (-not [Uri]::IsHexDigit($hexChar)) {
                throw "Installed model returned a non-hexadecimal SHA-256 digest."
              }
            }
            $modelDigest = "sha256:" + $hexDigest.ToLowerInvariant()
            if ($modelDigest -ne [string]$manifest.model.digest) {
              throw "Installed qwen3.5:4b digest differs from checkpoint; refusing mixed-model continuation."
            }

            $env:RADONC_MODEL_DIGEST = $modelDigest
            $env:RADONC_AGENT_CONCURRENCY = "1"
            $env:RADONC_VALIDATION_CPU_ONLY = "1"
            $env:OLLAMA_BASE_URL = $ollamaUrl
            $env:OLLAMA_HOST = "127.0.0.1:11435"
            $env:OLLAMA_MODELS = Join-Path $localAppData "RadOncMDT\Models"
            $env:OLLAMA_MODEL = "qwen3.5:4b"
            Write-Host "HOSTED_CPU_RESUME_OLLAMA_READY=$($version.version)"
            Write-Host "HOSTED_CPU_RESUME_MODEL_DIGEST=$modelDigest"
            Write-Host "HOSTED_CPU_RESUME_CHECKPOINT_RUN=$env:RADONC_CHECKPOINT_RUN_ID"
            Write-Host "HOSTED_CPU_ONLY=TRUE; NVIDIA telemetry is intentionally not collected."
            python backend/scripts/resume_hosted_four_round_validation.py
            $exitCode = $LASTEXITCODE
          }
          finally {
            $pidFile = Join-Path $localAppData "RadOncMDT\AIEngine\ollama-server.pid"
            if (Test-Path -LiteralPath $pidFile -PathType Leaf) {
              $ollamaPid = 0
              if ([int]::TryParse((Get-Content -LiteralPath $pidFile -Raw).Trim(),[ref]$ollamaPid)) {
                $processInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $ollamaPid" -ErrorAction SilentlyContinue
                $managedRoot = [IO.Path]::GetFullPath((Join-Path $localAppData "RadOncMDT\AIEngine\Ollama")) + "\"
                $actualPath = [string]$processInfo.ExecutablePath
                if ($processInfo -and $actualPath -and [IO.Path]::GetFullPath($actualPath).StartsWith($managedRoot,[StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $ollamaPid -Force
                  Write-Host "HOSTED_ISOLATED_OLLAMA_STOPPED"
                }
              }
            }
          }

          if ($exitCode -ne 0) {
            throw "Checkpoint continuation failed or retained quality-gate findings (exit $exitCode); inspect the uploaded audit artifact."
          }

      - name: Upload resumed R3/R4 audit and latest checkpoint
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: radonc-hosted-cpu-four-round-validation
          path: |
            backend/validation_artifacts/live_four_round_hosted_cpu_validation.sqlite3
            backend/validation_artifacts/live_four_round_hosted_cpu_manifest.json
            backend/validation_artifacts/live_four_round_hosted_cpu_resume_manifest.json
            backend/validation_artifacts/live_four_round_hosted_cpu_resume_validation.json
          if-no-files-found: warn
          retention-days: 14
