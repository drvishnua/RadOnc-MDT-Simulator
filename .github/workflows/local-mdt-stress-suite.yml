name: Local Ollama MDT Stress Suite

on:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/mdt-stress-request.json"

permissions:
  contents: read

concurrency:
  group: local-ollama-mdt-stress-suite
  cancel-in-progress: false

jobs:
  stress-suite:
    if: github.actor == 'drvishnua'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      OLLAMA_MODEL: qwen3.5:4b
      RADONC_AGENT_CONCURRENCY: "1"
    steps:
      - name: Check out the exact requested development-branch commit
        uses: actions/checkout@v4
        with:
          ref: feature/four-round-mdt-and-performance
          clean: false
      - name: Validate request and local runtime
        id: request
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $branch = git branch --show-current
          $sha = git rev-parse HEAD
          if ($branch -ne "feature/four-round-mdt-and-performance") { throw "Unexpected branch: $branch" }
          $request = Get-Content ".github/mdt-stress-request.json" -Raw | ConvertFrom-Json
          if ($request.requested_by -ne "drvishnua") { throw "Unauthorised stress request." }
          $allowed = @("MDT-002","MDT-003","MDT-004","MDT-005","MDT-006","MDT-007")
          $ids = @($request.case_ids)
          if ($ids.Count -lt 1 -or @($ids | Where-Object { $_ -notin $allowed }).Count -gt 0 -or ($ids | Select-Object -Unique).Count -ne $ids.Count) {
            throw "Invalid stress case IDs."
          }
          "STRESS_CASE_IDS=$($ids -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "STRESS_REQUEST_ID=$($request.request_id)"
          Write-Host "STRESS_COMMIT=$sha"
          Write-Host "STRESS_BRANCH=$branch"
          Write-Host "STRESS_CASE_IDS=$($ids -join ',')"
          python --version
          $ollama = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/version" -TimeoutSec 10
          Write-Host "OLLAMA_VERSION=$($ollama.version)"
          ollama list
          nvidia-smi
      - name: Install backend dependencies
        shell: powershell
        working-directory: backend
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }
      - name: Run synthetic MDT stress suite
        shell: powershell
        working-directory: backend
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/run_mdt_stress_suite.py --case-ids $env:STRESS_CASE_IDS
          if ($LASTEXITCODE -ne 0) { throw "Stress suite returned exit code $LASTEXITCODE." }
      - name: Upload complete stress report and SQLite audit database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radonc-mdt-stress-suite-${{ github.run_id }}
          path: |
            backend/validation_artifacts/stress_suite/stress_suite_report.json
            backend/validation_artifacts/stress_suite/stress_suite.sqlite3
          if-no-files-found: warn
          retention-days: 30
