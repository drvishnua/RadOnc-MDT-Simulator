name: Local Ollama MDT Stress Suite

on:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/mdt-stress-request.json"

permissions:
  contents: read

concurrency:
  group: local-ollama-mdt-stress-suite
  cancel-in-progress: false

jobs:
  stress-suite:
    if: github.actor == 'drvishnua'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      OLLAMA_MODEL: qwen3.5:4b
      RADONC_AGENT_CONCURRENCY: "1"
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Validate request and local runtime
        id: request
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sha = git rev-parse HEAD
          if ($sha -ne $env:GITHUB_SHA) { throw "Checkout SHA $sha does not match triggering SHA $env:GITHUB_SHA." }
          if ($env:GITHUB_REF -ne "refs/heads/feature/four-round-mdt-and-performance") { throw "Unexpected triggering ref: $env:GITHUB_REF" }
          $request = Get-Content ".github/mdt-stress-request.json" -Raw | ConvertFrom-Json
          if ($request.requested_by -ne "drvishnua") { throw "Unauthorised stress request." }
          $allowed = @("MDT-002","MDT-003","MDT-004","MDT-005","MDT-006","MDT-007")
          $ids = @($request.case_ids)
          if ($ids.Count -lt 1 -or @($ids | Where-Object { $_ -notin $allowed }).Count -gt 0 -or ($ids | Select-Object -Unique).Count -ne $ids.Count) {
            throw "Invalid stress case IDs."
          }
          "STRESS_CASE_IDS=$($ids -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "STRESS_REQUEST_ID=$($request.request_id)"
          Write-Host "STRESS_COMMIT=$sha"
          Write-Host "STRESS_CASE_IDS=$($ids -join ',')"
          python --version
          $ollama = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/version" -TimeoutSec 10
          Write-Host "OLLAMA_VERSION=$($ollama.version)"
          ollama list
          nvidia-smi
      - name: Install backend dependencies
        shell: powershell
        working-directory: backend
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }
      - name: Run synthetic MDT stress suite
        shell: powershell
        working-directory: backend
        run: |
          $ErrorActionPreference = "Stop"
          $diagnostics = "validation_artifacts/stress_suite/runner_diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $stdoutLog = Join-Path $diagnostics "stress_stdout.log"
          $stderrLog = Join-Path $diagnostics "stress_stderr.log"
          @{
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            workflow = $env:GITHUB_WORKFLOW
            runner_name = $env:RUNNER_NAME
            started_at_utc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json -Depth 4 | Set-Content "$diagnostics/run_metadata.json" -Encoding utf8
          Start-Transcript -Path "$diagnostics/powershell_transcript.txt" -Force
          try {
            # Invoke Python through cmd.exe so Windows PowerShell 5.1 does not convert
            # native stderr lines into terminating NativeCommandError records.
            # cmd.exe propagates the Python process exit code because Python is the
            # final command in this /c invocation.
            $cmdLine = 'python scripts/run_mdt_stress_suite.py --case-ids ' + $env:STRESS_CASE_IDS + ' 1> "' + $stdoutLog + '" 2> "' + $stderrLog + '"'
            & $env:ComSpec /d /c $cmdLine
            $stressExitCode = $LASTEXITCODE
          }
          finally {
            Stop-Transcript
          }
          Write-Host "=== STRESS SUITE STDOUT ==="
          if (Test-Path $stdoutLog) { Get-Content $stdoutLog | ForEach-Object { Write-Host $_ } }
          Write-Host "=== STRESS SUITE STDERR ==="
          if (Test-Path $stderrLog) { Get-Content $stderrLog | ForEach-Object { Write-Host $_ } }
          Write-Host "STRESS_SUITE_EXIT_CODE=$stressExitCode"
          if ($stressExitCode -ne 0) { throw "Stress suite returned exit code $stressExitCode." }
          $report = Get-Content "validation_artifacts/stress_suite/stress_suite_report.json" -Raw | ConvertFrom-Json
          if ($report.simulator_commit -ne $env:GITHUB_SHA) {
            throw "Report simulator_commit $($report.simulator_commit) does not match triggering SHA $env:GITHUB_SHA."
          }
      - name: Upload stress checkpoints, audit database and runner diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radonc-mdt-stress-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/validation_artifacts/stress_suite/stress_suite_report.json
            backend/validation_artifacts/stress_suite/stress_suite.sqlite3
            backend/validation_artifacts/stress_suite/runner_diagnostics/
          if-no-files-found: warn
          retention-days: 30
