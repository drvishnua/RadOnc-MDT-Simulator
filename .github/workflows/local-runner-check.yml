name: Local Runner and GPU Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/local-runner-check.yml"

permissions:
  contents: read

concurrency:
  group: local-runner-check
  cancel-in-progress: false

jobs:
  verify:
    name: Inspect Windows runner, NVIDIA GPU, and Ollama
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect system and GPU
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== RUNNER ==="
          whoami
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Write-Host "=== NVIDIA GPU ==="
          $nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($nvidia) {
            nvidia-smi
            Write-Host "NVIDIA_SMI_STATUS=$LASTEXITCODE"
          } else {
            Write-Host "NVIDIA_SMI_NOT_FOUND"
          }
          Write-Host "=== OLLAMA ==="
          $ollama = Get-Command ollama -ErrorAction SilentlyContinue
          if ($ollama) {
            ollama --version
            Write-Host "OLLAMA_FOUND"
          } else {
            Write-Host "OLLAMA_NOT_FOUND_IN_RUNNER_PATH"
          }
          Write-Host "=== DIAGNOSTIC COMPLETE ==="
