name: Local Runner Connection Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-runner-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Windows self-hosted runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Confirm runner environment
        shell: powershell
        run: |
          Write-Host "RadOnc MDT Simulator local runner is connected."
          Write-Host "Operating system:"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion
          Write-Host "Runner identity:"
          whoami
