name: Sync Local Source Folder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/four-round-mdt-and-performance
    paths-ignore:
      - ".github/workflows/live-four-round-validation.yml"
      - ".github/workflows/ollama-gpu-diagnostic.yml"
      - ".github/scripts/install-release-candidate.ps1"
      - ".github/workflows/install-windows-release-candidate.yml"
      - ".github/workflows/sync-local-source.yml"
      - ".github/workflows/packaging-prerequisites.yml"
      - "backend/scripts/live_four_round_validation.py"
      - "backend/app/main.py"
      - "backend/tests/test_static_frontend.py"
      - "backend/app/services/run_store.py"
      - "backend/tests/test_database_migration.py"
      - "frontend/src/App.tsx"
      - "frontend/vite.config.ts"
      - "backend/launch_installed.py"
      - "packaging/windows/**"
      - "README.md"
      - "docs/IMPLEMENTATION_STATUS.md"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: sync-local-source
  cancel-in-progress: true

jobs:
  sync:
    name: Sync source into research folder
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync source without touching local models or runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE "..\..\..\..")).Path
          $destination = Join-Path $projectRoot "Source"
          $marker = Join-Path $destination ".radonc-github-managed"

          if ((Test-Path $destination) -and -not (Test-Path $marker)) {
            throw "The Source folder already exists and is not marked as GitHub-managed. Refusing to overwrite it."
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Set-Content -Path $marker -Value "Managed by the RadOnc MDT Simulator GitHub sync workflow." -Encoding UTF8

          Write-Host "Repository checkout: $env:GITHUB_WORKSPACE"
          Write-Host "Sync branch: $env:GITHUB_REF_NAME"
          Write-Host "Sync commit: $env:GITHUB_SHA"
          Write-Host "Local source destination: $destination"

          & robocopy.exe $env:GITHUB_WORKSPACE $destination /E /XD .git node_modules .venv __pycache__ .local-logs /NFL /NDL /NJH /NJS /NP
          $copyCode = $LASTEXITCODE
          if ($copyCode -ge 8) {
            throw "Robocopy failed with exit code $copyCode."
          }
          # Robocopy codes 0-7 indicate success or successful copy differences.
          $global:LASTEXITCODE = 0

          $requiredFiles = @(
            "backend\app\main.py",
            "frontend\package.json",
            "scripts\start-local.ps1",
            "docs\PRODUCT_SPEC.md"
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path (Join-Path $destination $relativePath))) {
              throw "Required source file missing after sync: $relativePath"
            }
          }

          $syncState = [ordered]@{
            repository = "drvishnua/RadOnc-MDT-Simulator"
            branch = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            synced_at_utc = [DateTime]::UtcNow.ToString("o")
          }
          $statePath = Join-Path $destination ".radonc-sync-state.json"
          $syncState | ConvertTo-Json | Set-Content -Path $statePath -Encoding UTF8

          $verifiedState = Get-Content -Path $statePath -Raw | ConvertFrom-Json
          if ($verifiedState.commit -ne $env:GITHUB_SHA -or $verifiedState.branch -ne $env:GITHUB_REF_NAME) {
            throw "Local sync state verification failed."
          }

          Write-Host "LOCAL_SOURCE_SYNC_OK"
          Write-Host "Verified local Source version: $($verifiedState.branch) @ $($verifiedState.commit)"
          Write-Host "Copy mode: additive/update only; unrelated local files are not deleted."
          Write-Host "Local runner, AI_Models, node_modules, virtual environments and local logs are excluded."


      - name: Restart backend against synchronized source
        if: github.ref == 'refs/heads/feature/four-round-mdt-and-performance'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE "..\..\..\..")).Path
          $destination = Join-Path $projectRoot "Source"
          $restartScript = Join-Path $destination "scripts\restart-local-backend.ps1"
          if (-not (Test-Path $restartScript)) {
            throw "Guarded backend restart script was not copied to Source."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($restartScript, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Host ("POWERSHELL_PARSE_ERROR line={0} column={1} text={2} message={3}" -f $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Extent.Text, $parseError.Message)
            }
            throw "PowerShell parser rejected restart-local-backend.ps1."
          }
          & $restartScript -SourceRoot $destination



      - name: Verify patient registry save, refresh, edit, and restore in Edge
        if: github.ref == 'refs/heads/feature/four-round-mdt-and-performance'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE "..\..\..\..")).Path
          $destination = Join-Path $projectRoot "Source"
          $browserTest = Join-Path $destination "scripts\test-patient-registry-browser.mjs"
          if (-not (Test-Path $browserTest)) {
            throw "Patient-registry browser regression script was not copied to Source."
          }

          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          $nodeExecutable = if ($nodeCommand) { $nodeCommand.Source } else { $null }
          $nodeVersion = $null
          if ($nodeExecutable) {
            try { $nodeVersion = [version]((& $nodeExecutable --version 2>$null).Trim().TrimStart("v")) } catch { $nodeVersion = $null }
          }
          $supportedNode = $nodeVersion -and ($nodeVersion.Major -gt 22 -or ($nodeVersion.Major -eq 22 -and $nodeVersion -ge [version]"22.12.0"))
          if (-not $supportedNode) {
            $nodeCache = Join-Path (Split-Path -Parent $destination) "actions-runner\_work\_tool\node"
            if (Test-Path $nodeCache) {
              $candidates = Get-ChildItem $nodeCache -Directory |
                Sort-Object { try { [version]$_.Name } catch { [version]"0.0" } } -Descending
              foreach ($candidate in $candidates) {
                $candidateNode = Join-Path (Join-Path $candidate.FullName "x64") "node.exe"
                if (-not (Test-Path $candidateNode)) { continue }
                try { $candidateVersion = [version]((& $candidateNode --version 2>$null).Trim().TrimStart("v")) } catch { continue }
                if ($candidateVersion.Major -gt 22 -or ($candidateVersion.Major -eq 22 -and $candidateVersion -ge [version]"22.12.0")) {
                  $nodeExecutable = $candidateNode
                  $supportedNode = $true
                  break
                }
              }
            }
          }
          if (-not $supportedNode -or -not $nodeExecutable) {
            throw "Node.js 22.12 or newer is required for the browser-regression WebSocket client."
          }

          & $nodeExecutable $browserTest
          if ($LASTEXITCODE -ne 0) {
            throw "Patient-registry browser regression failed with exit code $LASTEXITCODE."
          }

      - name: Diagnose the running local app after source sync
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE "..\..\..\..")).Path
          $destination = Join-Path $projectRoot "Source"
          $diagnosticScript = Join-Path $destination "scripts\diagnose-local.ps1"
          if (-not (Test-Path $diagnosticScript)) {
            throw "Local app diagnostic script was not copied to Source."
          }
          & $diagnosticScript -SourceRoot $destination

