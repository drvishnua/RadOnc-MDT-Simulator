name: "PAUSED — Local source folder synchronisation"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: "Security pause — no target-machine test executed"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain temporary hosted-runner policy
        run: |
          echo "This workflow is intentionally paused while the repository is public."
          echo "This workflow previously wrote repository files and restarted processes on the target laptop. Automatic remote writes to the laptop are suspended."
          echo "No laptop installation, local source sync, Ollama inference, MDT stress run, or GPU measurement was performed."
          echo "This notice is not a functional test pass. Use the standard hosted CI workflows for code validation."
