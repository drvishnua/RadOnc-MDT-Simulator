name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/**"
      - "Start-RadOnc-MDT.cmd"
      - "Stop-RadOnc-MDT.cmd"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build
  cancel-in-progress: true

jobs:
  build:
    name: Validate launcher and build frontend
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local launcher PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $scripts = @("scripts/start-local.ps1", "scripts/stop-local.ps1")
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($script + ": " + $_.Message) }
              exit 1
            }
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE "Start-RadOnc-MDT.cmd"))) {
            throw "Start command wrapper is missing."
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE "Stop-RadOnc-MDT.cmd"))) {
            throw "Stop command wrapper is missing."
          }
          Write-Host "Start/stop PowerShell scripts and command wrappers are present and valid."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        shell: powershell
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Type-check and build
        working-directory: frontend
        shell: powershell
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
