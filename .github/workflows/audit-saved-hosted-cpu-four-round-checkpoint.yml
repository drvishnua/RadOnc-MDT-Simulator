name: Audit Saved Hosted CPU Four-Round Checkpoint

on:
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: "Workflow run ID whose immutable checkpoint artifact is being audited"
        required: true
        default: "43753957255"
      checkpoint_artifact_name:
        description: "Exact artifact name from the selected checkpoint run"
        required: true
        default: "radonc-hosted-cpu-four-round-validation"
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - ".github/workflows/audit-saved-hosted-cpu-four-round-checkpoint.yml"
      - "backend/scripts/resume_hosted_four_round_validation.py"
      - "backend/tests/test_resume_hosted_four_round_validation.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: radonc-audit-saved-hosted-cpu-checkpoint
  cancel-in-progress: false

jobs:
  audit-saved-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audit-hosted-cpu-checkpoint]') }}
    name: Re-audit completed saved 136-contribution checkpoint without inference
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RADONC_CHECKPOINT_RUN_ID: ${{ github.event.inputs.checkpoint_run_id || '43753957255' }}
      RADONC_VALIDATION_CPU_ONLY: "1"
      RADONC_AUDIT_ONLY: "1"
    steps:
      - name: Check out audit implementation
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install isolated audit dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }

      - name: Restore exact run-9 checkpoint artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ github.event.inputs.checkpoint_artifact_name || 'radonc-hosted-cpu-four-round-validation' }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RADONC_CHECKPOINT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend/validation_artifacts/checkpoint

      - name: Verify artifact identity and stage immutable copies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $checkpointDirectory = Join-Path $env:GITHUB_WORKSPACE "backend\validation_artifacts\checkpoint"
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "backend\validation_artifacts"
          $databaseName = "live_four_round_hosted_cpu_validation.sqlite3"
          $manifestName = "live_four_round_hosted_cpu_manifest.json"
          $resumeManifestName = "live_four_round_hosted_cpu_resume_manifest.json"
          $previousReportName = "live_four_round_hosted_cpu_resume_validation.json"
          $checkpointDatabase = Join-Path $checkpointDirectory $databaseName
          $checkpointManifest = Join-Path $checkpointDirectory $manifestName
          $checkpointResumeManifest = Join-Path $checkpointDirectory $resumeManifestName
          $checkpointReport = Join-Path $checkpointDirectory $previousReportName

          foreach ($path in @($checkpointDatabase,$checkpointManifest,$checkpointResumeManifest,$checkpointReport)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required original run-9 checkpoint file is missing: $path"
            }
          }

          $manifest = Get-Content -LiteralPath $checkpointResumeManifest -Raw | ConvertFrom-Json
          $prior = Get-Content -LiteralPath $checkpointReport -Raw | ConvertFrom-Json
          if ([string]$manifest.source.workflow_run_id -ne "43714529807") {
            throw "Checkpoint lineage does not refer to the original run-16 source."
          }
          if ([string]$manifest.source.commit_sha -ne "4683b0767bf5cade408e85ec31ef248b34e5321e") {
            throw "Original checkpoint source SHA is unexpected."
          }
          if ([string]$manifest.resume_checkpoint.checkpoint_workflow_run_id -ne [string]$env:RADONC_CHECKPOINT_RUN_ID) {
            throw "Latest checkpoint workflow ID does not match the selected artifact run."
          }
          if ([string]$prior.resume_workflow_run_id -ne [string]$env:RADONC_CHECKPOINT_RUN_ID) {
            throw "Previous validation report does not belong to the selected checkpoint run."
          }
          if ($prior.status -ne "failed_resume_validation" -or [string]$prior.error -notlike "*Chair synthesis omits R1 position counts*") {
            throw "Selected report is not the expected run-9 validator-label failure."
          }
          if ($manifest.execution.mode -ne "github_hosted_cpu_only" -or $manifest.execution.gpu_measured -ne $false -or $manifest.execution.agent_concurrency -ne 1 -or $manifest.execution.expected_role_count -ne 45) {
            throw "Checkpoint execution contract is not the expected 45-role CPU-only run at concurrency 1."
          }
          if ([string]$manifest.model.digest -ne "sha256:d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04") {
            throw "Checkpoint model digest differs from the immutable Qwen baseline."
          }

          $actualDatabaseHash = (Get-FileHash -LiteralPath $checkpointDatabase -Algorithm SHA256).Hash.ToLowerInvariant()
          $recordedDatabaseHash = ([string]$prior.sqlite_database_sha256).ToLowerInvariant()
          if (-not $recordedDatabaseHash -or $actualDatabaseHash -ne $recordedDatabaseHash) {
            throw "Restored SQLite hash does not match the exact hash saved in the original run-9 report."
          }

          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Copy-Item -LiteralPath $checkpointDatabase -Destination (Join-Path $artifactDirectory $databaseName) -Force
          Copy-Item -LiteralPath $checkpointManifest -Destination (Join-Path $artifactDirectory $manifestName) -Force
          Copy-Item -LiteralPath $checkpointResumeManifest -Destination (Join-Path $artifactDirectory $resumeManifestName) -Force
          Copy-Item -LiteralPath $checkpointReport -Destination (Join-Path $artifactDirectory "prior_run9_resume_validation.json") -Force

          $env:RADONC_CHECKPOINT_MANIFEST = Join-Path $artifactDirectory $resumeManifestName
          $env:RADONC_MODEL_DIGEST = [string]$manifest.model.digest
          Write-Host "AUDIT_ONLY_CHECKPOINT_RUN=$env:RADONC_CHECKPOINT_RUN_ID"
          Write-Host "AUDIT_ONLY_SQLITE_SHA256=$actualDatabaseHash"
          Write-Host "AUDIT_ONLY_MODEL_DIGEST=$env:RADONC_MODEL_DIGEST"
          Write-Host "AUDIT_ONLY_NO_OLLAMA_OR_INFERENCE=TRUE"

      - name: Re-run deterministic validation and saved-output quality gates only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python backend/scripts/resume_hosted_four_round_validation.py
          $scriptExitCode = $LASTEXITCODE
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "backend\validation_artifacts\live_four_round_hosted_cpu_resume_validation.json"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Audit-only script did not write its report."
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          Write-Host "AUDIT_ONLY_STATUS=$($report.status)"
          Write-Host "AUDIT_ONLY_RUN_ID=$($report.run_id)"
          Write-Host "AUDIT_ONLY_SAVED_CONTRIBUTIONS=$($report.saved_contribution_count)"
          Write-Host "AUDIT_ONLY_QUALITY_FLAGS=$(@($report.quality_gate_failures).Count)"
          Write-Host "AUDIT_ONLY_DATABASE_UNCHANGED=$($report.checkpoint_database_unchanged)"
          if ($report.audit_only -ne $true -or $report.inference_performed -ne $false) {
            throw "The result does not prove audit-only execution."
          }
          if ($report.checkpoint_database_unchanged -ne $true) {
            throw "Audit-only verification failed to preserve the SQLite checkpoint byte-for-byte."
          }
          if ($scriptExitCode -ne 0) {
            throw "Deterministic validation/quality gate did not pass; the full audit report is retained."
          }

      - name: Upload immutable checkpoint and audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: radonc-hosted-cpu-four-round-audit-only-${{ github.run_id }}
          path: |
            backend/validation_artifacts/live_four_round_hosted_cpu_validation.sqlite3
            backend/validation_artifacts/live_four_round_hosted_cpu_manifest.json
            backend/validation_artifacts/live_four_round_hosted_cpu_resume_manifest.json
            backend/validation_artifacts/prior_run9_resume_validation.json
            backend/validation_artifacts/live_four_round_hosted_cpu_resume_validation.json
          if-no-files-found: warn
          retention-days: 30
