name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests
  cancel-in-progress: true

jobs:
  test:
    name: Install backend dependencies and run tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find installed Python 3.11 or newer
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== PYTHON LAUNCHERS ==="
          $launcher = Get-Command py -ErrorAction SilentlyContinue
          if ($launcher) {
            py -0p
          }
          $selected = $null
          if ($launcher) {
            foreach ($version in @("3.13", "3.12", "3.11")) {
              $candidate = & py "-$version" -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                $selected = [string]($candidate | Select-Object -Last 1)
                break
              }
            }
          }
          if (-not $selected) {
            $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
            if ($pythonCommand) {
              $candidate = & python -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                $selected = [string]($candidate | Select-Object -Last 1)
              }
            }
          }
          if (-not $selected) {
            Write-Error "No usable Python 3.11+ installation found on this laptop."
            exit 1
          }
          $version = & $selected -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ([version]$version -lt [version]"3.11") {
            Write-Error "Python 3.11 or newer is required; found $version."
            exit 1
          }
          Write-Host "Selected Python: $selected"
          Write-Host "Python version: $version"
          "PYTHON_EXE=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        working-directory: backend
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend tests
        working-directory: backend
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
