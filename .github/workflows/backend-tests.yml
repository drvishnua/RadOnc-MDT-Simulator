name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/four-round-mdt-and-performance
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests
  cancel-in-progress: true

jobs:
  test:
    name: Install backend dependencies and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile live four-round validation script
        working-directory: backend
        run: python -m py_compile scripts/live_four_round_validation.py

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
