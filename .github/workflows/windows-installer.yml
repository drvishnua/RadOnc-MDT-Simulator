name: Windows Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-round-mdt-and-performance
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: windows-installer-build
  cancel-in-progress: false

jobs:
  installer:
    name: Build and smoke-test Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"

      - name: Build and test frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed." }

      - name: Install backend and packaging dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r backend/requirements.txt "pyinstaller>=6.11,<7"
          if ($LASTEXITCODE -ne 0) { throw "Backend/PyInstaller dependencies failed." }

      - name: Validate AI bootstrap syntax and safety guards
        shell: powershell
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Test-AiBootstrap.ps1")
          if (-not $?) { throw "AI bootstrap static acceptance failed." }

      - name: Build packaged application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/windows/radonc_mdt.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller one-directory build failed." }
          if (-not (Test-Path "dist/RadOncMDT/RadOncMDT.exe")) { throw "Packaged executable is missing." }
          if (-not (Test-Path "dist/RadOncMDT/_internal/frontend/dist/index.html")) {
            throw "Bundled production frontend is missing from the PyInstaller layout."
          }

      - name: Install Inno Setup on the hosted build worker
        shell: powershell
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $candidates = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe was not found after Inno Setup installation." }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "packaging/windows/RadOnc-MDT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "dist/installer/RadOnc-MDT-Simulator-Setup.exe")) {
            throw "Setup.exe was not generated."
          }

      - name: Install Setup.exe and smoke-test the installed application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist/installer/RadOnc-MDT-Simulator-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "RadOnc MDT Installed"
          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc MDT Test LocalAppData"
          New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData
          $env:RADONC_PORT = "18765"

          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=""$installDir""")
          $install = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $exe = Join-Path $installDir "RadOncMDT.exe"
          if (-not (Test-Path $exe)) { throw "Installed RadOncMDT.exe is missing." }
          $stdout = Join-Path $env:RUNNER_TEMP "radonc-installed.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "radonc-installed.stderr.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $webClient = $null
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $details = if (Test-Path $stderr) { (Get-Content $stderr -Tail 50) -join [Environment]::NewLine } else { "No stderr log." }
                throw "Installed executable exited early (code $($process.ExitCode)). $details"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {
                $health = $null
              }
              Start-Sleep -Seconds 1
            }
            if (-not $health -or $health.application -ne "RadOnc MDT Simulator") {
              $details = if (Test-Path $stderr) { (Get-Content $stderr -Tail 50) -join [Environment]::NewLine } else { "No stderr log." }
              throw "Installed executable did not return its health response. $details"
            }

            $webClient = New-Object System.Net.WebClient
            $pageContent = $webClient.DownloadString("http://127.0.0.1:18765/")
            if ($pageContent -notmatch 'id="root"') {
              throw "Installed frontend index did not load."
            }
            $scriptMatch = [regex]::Match($pageContent, 'src="(?<asset>/assets/[^"]+\.js)"')
            if (-not $scriptMatch.Success) { throw "Built JavaScript asset was not referenced by index.html." }
            $assetContent = $webClient.DownloadString("http://127.0.0.1:18765" + $scriptMatch.Groups["asset"].Value)
            if ($assetContent.Length -lt 1000) {
              throw "Built frontend JavaScript asset was not served."
            }

            $agents = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/agents" -TimeoutSec 10
            if ($agents.returned_agent_count -ne 45) { throw "Installed API did not return all 45 role profiles." }
            $casePayload = @{
              scenario_title = "Installer acceptance training case"
              case_summary = "Fictional training record used only to verify local database persistence."
              primary_site = "Test site"
              histology = "Test histology"
            } | ConvertTo-Json -Depth 6
            $patientPayload = @{
              patient_name = "Installer Acceptance Record"
              case = ($casePayload | ConvertFrom-Json)
            } | ConvertTo-Json -Depth 8
            $savedPatient = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/patients" -Method Post -ContentType "application/json" -Body $patientPayload -TimeoutSec 10
            if ($savedPatient.patient_identifier -ne "RAD-000001") {
              throw "Installed application did not persist its first training registry record."
            }

            $expectedDb = Join-Path $localAppData "RadOncMDT\Data\simulation_runs.sqlite3"
            if (-not (Test-Path $expectedDb)) { throw "SQLite database was not created in the user data directory." }
            $bundledDb = Get-ChildItem -Path $installDir -Filter "simulation_runs.sqlite3" -Recurse -ErrorAction SilentlyContinue
            if ($bundledDb) { throw "Application database was incorrectly created inside the install directory." }
            $databaseHashBeforeUninstall = (Get-FileHash -Algorithm SHA256 $expectedDb).Hash

            Write-Host "INSTALLED_HEALTH_OK"
            Write-Host "INSTALLED_FRONTEND_OK"
            Write-Host "INSTALLED_API_45_ROLES_OK"
            Write-Host "USER_DATA_DATABASE_PATH_OK"
            Write-Host "TRAINING_RECORD_SAVE_OK"

            # Stop the exact process started by this smoke test before uninstalling.
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(10000) | Out-Null
              $process.Refresh()
              if (-not $process.HasExited) { throw "Installed application did not stop before uninstall." }
            }

            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $uninstaller)) { throw "Inno Setup uninstaller was not installed." }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
            if (Test-Path $exe) { throw "Application executable remains after uninstall." }
            if (-not (Test-Path $expectedDb)) { throw "Uninstall removed the user database." }
            $databaseHashAfterUninstall = (Get-FileHash -Algorithm SHA256 $expectedDb).Hash
            if ($databaseHashAfterUninstall -ne $databaseHashBeforeUninstall) {
              throw "Uninstall changed the saved user database."
            }
            Write-Host "UNINSTALL_PRESERVED_USER_DATABASE_OK"
            Write-Host "No Ollama request or model inference was performed."
          } finally {
            if ($webClient) { $webClient.Dispose() }
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Generate installer checksum
        shell: powershell
        run: |
          $installer = "dist/installer/RadOnc-MDT-Simulator-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  RadOnc-MDT-Simulator-Setup.exe" | Set-Content "dist/installer/SHA256SUMS.txt" -Encoding ASCII
          Write-Host "SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RadOnc-MDT-Simulator-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14


  hosted-first-run-bootstrap:
    name: Clean-hosted Windows first-run Ollama/model bootstrap
    # Real model provisioning/inference is an explicit acceptance run, not a per-PR rerun.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/four-round-mdt-and-performance')
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source for bounded live model validation
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python for bounded live model validation
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies for bounded live model validation
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed for model validation." }
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend runtime dependency installation failed for model validation." }

      - name: Download the installer built by this workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: RadOnc-MDT-Simulator-Windows-x64
          path: installer-artifact

      - name: Install on a clean hosted VM and verify real Ollama/model provisioning
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "installer-artifact"
          $installer = Join-Path $artifactRoot "RadOnc-MDT-Simulator-Setup.exe"
          $checksumFile = Join-Path $artifactRoot "SHA256SUMS.txt"
          $installDir = Join-Path $env:RUNNER_TEMP "RadOnc MDT First-Run Install"
          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc MDT First-Run LocalAppData"
          $appProcess = $null
          $installed = $false

          try {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "The installer artifact is missing."
            }
            if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
              throw "The installer SHA256SUMS.txt is missing."
            }
            $checksumLine = Get-Content -LiteralPath $checksumFile | Where-Object { $_ -match "RadOnc-MDT-Simulator-Setup\.exe" } | Select-Object -First 1
            if (-not $checksumLine -or $checksumLine -notmatch '^([0-9a-fA-F]{64})\s+') {
              throw "The installer checksum file is malformed."
            }
            $expectedHash = $Matches[1].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Downloaded installer SHA-256 does not match the build artifact checksum."
            }
            Write-Host "HOSTED_INSTALLER_SHA256_OK=$actualHash"

            New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
            $env:LOCALAPPDATA = $localAppData
            $env:RADONC_DATA_DIR = Join-Path $localAppData "RadOncMDT\Data"
            $env:RADONC_PORT = "18765"

            $driveRoot = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($localAppData))
            $driveName = $driveRoot.TrimEnd("\").TrimEnd(":")
            $drive = Get-PSDrive -Name $driveName -ErrorAction Stop
            Write-Host ("HOSTED_VM_FREE_BYTES_BEFORE_BOOTSTRAP={0}" -f $drive.Free)
            if ($drive.Free -lt 8GB) {
              throw "The disposable hosted VM has less than the bootstrap's required 8 GB free disk space."
            }

            foreach ($port in @(11434, 11435)) {
              $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
              if ($listeners.Count -gt 0) {
                throw "Port $port is already occupied; refusing to reuse or stop an unrelated service."
              }
            }
            $existingOllamaProcesses = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq "ollama.exe" })
            if ($existingOllamaProcesses.Count -gt 0) {
              throw "An Ollama process already exists on the hosted VM; a clean first-run test cannot be guaranteed."
            }

            $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=""$installDir""")
            $install = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Silent installation failed with exit code $($install.ExitCode)."
            }
            $installed = $true
            $exe = Join-Path $installDir "RadOncMDT.exe"
            $bootstrapPath = Join-Path $installDir "Ensure-RadOnc-AIEngine.ps1"
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Installed RadOncMDT.exe is missing."
            }
            if (-not (Test-Path -LiteralPath $bootstrapPath -PathType Leaf)) {
              throw "The installed AI runtime bootstrap script is missing."
            }

            . $bootstrapPath
            $preinstalledOllama = Find-RadOncOllamaExecutable
            if ($preinstalledOllama) {
              throw "The hosted VM has an existing Ollama executable at $preinstalledOllama; refusing to classify this as a clean bundled-runtime test."
            }

            Write-Host "HOSTED_FIRST_RUN_BOOTSTRAP_STARTED"
            $ollamaUrl = Ensure-RadOncAIEngine -DataDirectory $env:RADONC_DATA_DIR -LogDirectory (Join-Path $localAppData "RadOncMDT\Logs")
            if ($ollamaUrl -ne "http://127.0.0.1:11435") {
              throw "The clean-machine bootstrap did not select the isolated bundled Ollama endpoint."
            }

            $ollamaVersion = Invoke-RestMethod -Uri "$ollamaUrl/api/version" -TimeoutSec 10
            if ($ollamaVersion.version -ne $RadOncOllamaVersion) {
              throw "The bundled Ollama version differs from the pinned version."
            }
            $tags = Get-RadOncOllamaTags -BaseUrl $ollamaUrl
            if (-not (Test-RadOncModelInstalled -Tags $tags -ModelName $RadOncModelName)) {
              throw "The model pull completed without qwen3.5:4b appearing in /api/tags."
            }
            $modelsDirectory = Join-Path $localAppData "RadOncMDT\Models"
            if (-not (Test-Path -LiteralPath $modelsDirectory -PathType Container)) {
              throw "The separate user-data model directory was not created."
            }
            Write-Host "HOSTED_PORTABLE_OLLAMA_INSTALLED_OK=$($ollamaVersion.version)"
            Write-Host "HOSTED_QWEN35_4B_PULL_AND_TAG_VERIFICATION_OK"

            $env:OLLAMA_BASE_URL = $ollamaUrl
            $env:OLLAMA_MODEL = $RadOncModelName
            $inferenceBody = @{
              model = $RadOncModelName
              prompt = "Reply with exactly this token: RADONC_HOSTED_CPU_INFERENCE_OK"
              stream = $false
              think = $false
              options = @{ num_predict = 32; temperature = 0 }
            } | ConvertTo-Json -Depth 6
            $inference = Invoke-RestMethod -Uri "$ollamaUrl/api/generate" -Method Post -ContentType "application/json" -Body $inferenceBody -TimeoutSec 900
            $inferenceText = [string]$inference.response
            if ($inferenceText -notmatch "RADONC_HOSTED_CPU_INFERENCE_OK") {
              throw "The downloaded model did not return the expected hosted CPU inference marker."
            }
            Write-Host ("HOSTED_CPU_INFERENCE_OK response_chars={0} total_duration_ns={1}" -f $inferenceText.Length,$inference.total_duration)
            Write-Host "HOSTED_CPU_ONLY=TRUE; no target-laptop or NVIDIA GPU claim is made."

            $appStdout = Join-Path $env:RUNNER_TEMP "radonc-first-run-app.stdout.log"
            $appStderr = Join-Path $env:RUNNER_TEMP "radonc-first-run-app.stderr.log"
            $appProcess = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $appStdout -RedirectStandardError $appStderr
            $health = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                $details = if (Test-Path $appStderr) { (Get-Content $appStderr -Tail 60) -join [Environment]::NewLine } else { "No stderr log." }
                throw "Installed app exited before becoming ready (code $($appProcess.ExitCode)). $details"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18765/health" -TimeoutSec 3
                if ($health.status -eq "ok" -and $health.application -eq "RadOnc MDT Simulator") { break }
              } catch {
                $health = $null
              }
              Start-Sleep -Seconds 1
            }
            if (-not $health -or $health.status -ne "ok") {
              $details = if (Test-Path $appStderr) { (Get-Content $appStderr -Tail 60) -join [Environment]::NewLine } else { "No stderr log." }
              throw "The installed app did not become healthy after first-run AI provisioning. $details"
            }

            $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/runtime" -TimeoutSec 20
            if (-not $runtime.ollama.reachable -or -not $runtime.ollama.configured_model_installed -or $runtime.ollama.configured_model -ne $RadOncModelName) {
              throw ("Installed app cannot verify its bootstrapped model: " + ($runtime.ollama | ConvertTo-Json -Compress -Depth 6))
            }
            $agents = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/agents" -TimeoutSec 15
            if ($agents.returned_agent_count -ne 45) {
              throw "Installed app did not expose all 45 configured specialist roles after bootstrap."
            }
            Write-Host "HOSTED_INSTALLED_APP_HEALTH_OK"
            Write-Host "HOSTED_INSTALLED_APP_MODEL_RUNTIME_OK"
            Write-Host "HOSTED_INSTALLED_APP_45_ROLES_OK"

            # Run six actual R2/R3 round calls, one isolated R3 adversarial positive-control
            # call, and a bounded three-role Chair R4 synthesis against this exact clean-hosted
            # Ollama/model instance. R1 uses deterministic fixtures; only actual round outputs
            # are saved/reloaded in disposable SQLite. This is CPU-only and does not invoke the
            # production 45-role round runner.
            $env:OLLAMA_BASE_URL = $ollamaUrl
            $env:OLLAMA_MODEL = $RadOncModelName
            Push-Location (Join-Path $env:GITHUB_WORKSPACE "backend")
            try {
              python scripts/representative_model_provenance_validation.py
              if ($LASTEXITCODE -ne 0) {
                throw "Representative live R2/R3 provenance validation failed its quality gates."
              }
            } finally {
              Pop-Location
            }
            Write-Host "HOSTED_REPRESENTATIVE_R2_R3_R4_VALIDATION_OK"
            Write-Host "No patient record or durable MDT run was created; bounded rows were isolated in temporary SQLite."
          }
          finally {
            if ($appProcess) {
              $appProcess.Refresh()
              if (-not $appProcess.HasExited) {
                $processInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $($appProcess.Id)" -ErrorAction SilentlyContinue
                $expectedApp = [IO.Path]::GetFullPath((Join-Path $installDir "RadOncMDT.exe"))
                if ($processInfo -and $processInfo.ExecutablePath -and [string]::Equals([IO.Path]::GetFullPath($processInfo.ExecutablePath),$expectedApp,[StringComparison]::OrdinalIgnoreCase)) {
                  Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
                  $appProcess.WaitForExit(10000) | Out-Null
                } else {
                  Write-Host "CLEANUP_REFUSED_TO_STOP_UNVERIFIED_APP_PROCESS"
                }
              }
            }

            $managedPidFile = Join-Path $localAppData "RadOncMDT\AIEngine\ollama-server.pid"
            if (Test-Path -LiteralPath $managedPidFile -PathType Leaf) {
              $ollamaPid = 0
              if ([int]::TryParse((Get-Content -LiteralPath $managedPidFile -Raw).Trim(),[ref]$ollamaPid)) {
                $ollamaInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $ollamaPid" -ErrorAction SilentlyContinue
                if ($ollamaInfo) {
                  $managedRoot = [IO.Path]::GetFullPath((Join-Path $localAppData "RadOncMDT\AIEngine\Ollama")) + "\"
                  $actualOllama = [string]$ollamaInfo.ExecutablePath
                  if ($actualOllama -and [IO.Path]::GetFullPath($actualOllama).StartsWith($managedRoot,[StringComparison]::OrdinalIgnoreCase)) {
                    Stop-Process -Id $ollamaPid -Force -ErrorAction SilentlyContinue
                  } else {
                    Write-Host "CLEANUP_REFUSED_TO_STOP_UNVERIFIED_OLLAMA_PROCESS"
                  }
                }
              }
            }
            if ($installed -and (Test-Path -LiteralPath $installDir)) {
              $uninstaller = Join-Path $installDir "unins000.exe"
              if (Test-Path -LiteralPath $uninstaller) {
                $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
                if ($uninstall.ExitCode -ne 0) {
                  Write-Host "HOSTED_CLEANUP_UNINSTALL_WARNING=$($uninstall.ExitCode)"
                }
              }
            }
          }

      - name: Upload representative live R2/R3/R4 Chair provenance report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: representative-r2-r3-r4-chair-provenance
          path: backend/validation_artifacts/representative_model_provenance_validation.json
          if-no-files-found: warn
          retention-days: 14
