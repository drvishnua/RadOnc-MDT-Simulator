name: Windows Installer Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: windows-installer-build
  cancel-in-progress: false

jobs:
  installer:
    name: Build and smoke-test Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend production build failed." }

      - name: Install backend and packaging dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r backend/requirements.txt "pyinstaller>=6.11,<7"
          if ($LASTEXITCODE -ne 0) { throw "Backend/PyInstaller dependencies failed." }

      - name: Build packaged application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/windows/radonc_mdt.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller one-directory build failed." }
          if (-not (Test-Path "dist/RadOncMDT/RadOncMDT.exe")) { throw "Packaged executable is missing." }
          if (-not (Test-Path "dist/RadOncMDT/_internal/frontend/dist/index.html")) {
            throw "Bundled production frontend is missing from the PyInstaller layout."
          }

      - name: Install Inno Setup on the hosted build worker
        shell: powershell
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $candidates = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe was not found after Inno Setup installation." }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "packaging/windows/RadOnc-MDT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "dist/installer/RadOnc-MDT-Simulator-Setup.exe")) {
            throw "Setup.exe was not generated."
          }

      - name: Install Setup.exe and smoke-test the installed application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist/installer/RadOnc-MDT-Simulator-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "RadOnc MDT Installed"
          $localAppData = Join-Path $env:RUNNER_TEMP "RadOnc MDT Test LocalAppData"
          New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData
          $env:RADONC_PORT = "18765"

          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=""$installDir""")
          $install = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $exe = Join-Path $installDir "RadOncMDT.exe"
          if (-not (Test-Path $exe)) { throw "Installed RadOncMDT.exe is missing." }
          $stdout = Join-Path $env:RUNNER_TEMP "radonc-installed.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "radonc-installed.stderr.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $webClient = $null
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $details = if (Test-Path $stderr) { (Get-Content $stderr -Tail 50) -join [Environment]::NewLine } else { "No stderr log." }
                throw "Installed executable exited early (code $($process.ExitCode)). $details"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {
                $health = $null
              }
              Start-Sleep -Seconds 1
            }
            if (-not $health -or $health.application -ne "RadOnc MDT Simulator") {
              $details = if (Test-Path $stderr) { (Get-Content $stderr -Tail 50) -join [Environment]::NewLine } else { "No stderr log." }
              throw "Installed executable did not return its health response. $details"
            }

            $webClient = New-Object System.Net.WebClient
            $pageContent = $webClient.DownloadString("http://127.0.0.1:18765/")
            if ($pageContent -notmatch 'id="root"') {
              throw "Installed frontend index did not load."
            }
            $scriptMatch = [regex]::Match($pageContent, 'src="(?<asset>/assets/[^"]+\.js)"')
            if (-not $scriptMatch.Success) { throw "Built JavaScript asset was not referenced by index.html." }
            $assetContent = $webClient.DownloadString("http://127.0.0.1:18765" + $scriptMatch.Groups["asset"].Value)
            if ($assetContent.Length -lt 1000) {
              throw "Built frontend JavaScript asset was not served."
            }

            $agents = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/agents" -TimeoutSec 10
            if ($agents.returned_agent_count -ne 45) { throw "Installed API did not return all 45 role profiles." }
            $casePayload = @{
              scenario_title = "Installer acceptance training case"
              case_summary = "Fictional training record used only to verify local database persistence."
              primary_site = "Test site"
              histology = "Test histology"
            } | ConvertTo-Json -Depth 6
            $patientPayload = @{
              patient_name = "Installer Acceptance Record"
              case = ($casePayload | ConvertFrom-Json)
            } | ConvertTo-Json -Depth 8
            $savedPatient = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/patients" -Method Post -ContentType "application/json" -Body $patientPayload -TimeoutSec 10
            if ($savedPatient.patient_identifier -ne "RAD-000001") {
              throw "Installed application did not persist its first training registry record."
            }

            $expectedDb = Join-Path $localAppData "RadOncMDT\Data\simulation_runs.sqlite3"
            if (-not (Test-Path $expectedDb)) { throw "SQLite database was not created in the user data directory." }
            $bundledDb = Get-ChildItem -Path $installDir -Filter "simulation_runs.sqlite3" -Recurse -ErrorAction SilentlyContinue
            if ($bundledDb) { throw "Application database was incorrectly created inside the install directory." }
            $databaseHashBeforeUninstall = (Get-FileHash -Algorithm SHA256 $expectedDb).Hash

            Write-Host "INSTALLED_HEALTH_OK"
            Write-Host "INSTALLED_FRONTEND_OK"
            Write-Host "INSTALLED_API_45_ROLES_OK"
            Write-Host "USER_DATA_DATABASE_PATH_OK"
            Write-Host "TRAINING_RECORD_SAVE_OK"

            # Stop the exact process started by this smoke test before uninstalling.
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(10000) | Out-Null
              $process.Refresh()
              if (-not $process.HasExited) { throw "Installed application did not stop before uninstall." }
            }

            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $uninstaller)) { throw "Inno Setup uninstaller was not installed." }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
            if (Test-Path $exe) { throw "Application executable remains after uninstall." }
            if (-not (Test-Path $expectedDb)) { throw "Uninstall removed the user database." }
            $databaseHashAfterUninstall = (Get-FileHash -Algorithm SHA256 $expectedDb).Hash
            if ($databaseHashAfterUninstall -ne $databaseHashBeforeUninstall) {
              throw "Uninstall changed the saved user database."
            }
            Write-Host "UNINSTALL_PRESERVED_USER_DATABASE_OK"
            Write-Host "No Ollama request or model inference was performed."
          } finally {
            if ($webClient) { $webClient.Dispose() }
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Generate installer checksum
        shell: powershell
        run: |
          $installer = "dist/installer/RadOnc-MDT-Simulator-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  RadOnc-MDT-Simulator-Setup.exe" | Set-Content "dist/installer/SHA256SUMS.txt" -Encoding ASCII
          Write-Host "SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadOnc-MDT-Simulator-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
