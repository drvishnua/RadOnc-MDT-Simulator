[project]
name = "radonc-mdt-simulator-backend"
version = "0.1.0"
description = "Local-first educational oncology MDT simulation backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
